[versions]
agp = "8.9.1"
kotlin = "2.1.0"
compose-bom = "2024.12.01"
activity-compose = "1.9.3"
core-splashscreen = "1.0.1"
xr-compose = "1.0.0-alpha17"
xr-scenecore = "1.0.0-beta02"
xr-runtime = "1.0.0-beta02"
okhttp = "4.12.0"
lifecycle-viewmodel-compose = "2.8.7"
coroutines = "1.9.0"
serialization-json = "1.9.0"
koog = "0.5.0"
ktor = "3.3.0"
junit = "4.13.2"
org-json = "20250517"
detekt = "1.23.8"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
xr-compose = { group = "androidx.xr.compose", name = "compose", version.ref = "xr-compose" }
xr-scenecore = { group = "androidx.xr.scenecore", name = "scenecore", version.ref = "xr-scenecore" }
xr-runtime = { group = "androidx.xr.runtime", name = "runtime", version.ref = "xr-runtime" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }
koog-agents = { group = "ai.koog", name = "koog-agents", version.ref = "koog" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Real org.json for JVM unit tests — the android.jar stub's methods throw
# "not mocked", so decodeList/decodeResult need the real implementation.
org-json = { group = "org.json", name = "json", version.ref = "org-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
