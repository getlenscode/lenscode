name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # XR client — JVM unit tests only; no emulator needed.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36 + accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        working-directory: client-android
        run: ./gradlew :app:testDebugUnitTest

      # Advisory for now — no lint baseline exists yet, so report only.
      - name: Android lint (advisory)
        working-directory: client-android
        run: ./gradlew :app:lintDebug
        continue-on-error: true

  # XR protocol schema + the bridge the Android client talks to.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            lenscode-bridge/package-lock.json

      # The bridge resolves @lenscode/protocol via a file: dependency pointing
      # at protocol/dist, so protocol must be installed and built first.
      - name: Protocol — install, typecheck, test
        working-directory: protocol
        run: npm ci && npm run build && npm test

      - name: Bridge — install, typecheck, test
        working-directory: lenscode-bridge
        run: npm ci && npm run build && npm test
